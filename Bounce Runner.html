<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Bounce Runner</title>
<style>
html,body{width:100%;height:100%;margin:0;padding:0;background:#7fd4ea;touch-action:none;overflow:hidden;-webkit-user-select:none;user-select:none}
body{display:flex;align-items:center;justify-content:center}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block;border:0}
</style></head><body>
<canvas id="c" width="96" height="128"></canvas>
<script>
var W=96,H=128,cv=document.getElementById('c'),g=cv.getContext('2d');
g.imageSmoothingEnabled=false;
function fit(){var s=Math.max(1,Math.floor(Math.min(innerWidth/W,innerHeight/H)));cv.style.width=W*s+'px';cv.style.height=H*s+'px';}
fit();addEventListener('resize',fit);
var SKY='#7fd4ea',BR='#C8651B',MO='#5E2808',HI='#E08A3A',NAVY='#000080',BLK='#000',FY=102,BS=12,BX=20;
function R(x,y,w,h,c){g.fillStyle=c;g.fillRect(Math.round(x),Math.round(y),w,h);}
var bs=document.createElement('canvas');bs.width=bs.height=BS;var b=bs.getContext('2d');
(function(){var r=BS/2,c=r-.5;for(var j=0;j<BS;j++)for(var i=0;i<BS;i++){var d=Math.sqrt((i-c)*(i-c)+(j-c)*(j-c));
if(d<=r){b.fillStyle=d>r-1.3?BLK:'#CCFF00';b.fillRect(i,j,1,1);}}
b.fillStyle='#F2FFB0';b.fillRect(7,2,2,1);b.fillRect(8,3,1,2);})();
var PIN=['..#..','..#..','.###.','..#..','.###.','..#..','.###.','#####'],PW=5,PH=8;
function pin(x){for(var j=0;j<PH;j++)for(var i=0;i<PW;i++)if(PIN[j][i]=='#')R(x+i,FY-PH+j,1,1,BLK);}
var F={'0':'111101101101111','1':'010110010010111','2':'111001111100111','3':'111001111001111','4':'101101111001001','5':'111100111001111','6':'111100111101111','7':'111001001010010','8':'111101111101111','9':'111101111001111',
A:'010101111101101',E:'111100111100111',G:'011100101101011',H:'101101111101101',I:'111010010010111',M:'101111111101101',O:'111101101101111',P:'111101111100100',R:'110101110101101',T:'111010010010010',V:'101101101101010'};
function txt(s,x,y,c){for(var i=0;i<s.length;i++){var d=F[s[i]];if(!d)continue;for(var k=0;k<15;k++)if(d[k]=='1')R(x+i*4+(k%3),y+((k/3)|0),1,1,c);}}
function pad(n){n=Math.floor(n);return ('00000'+n).slice(-5);}
var clouds=[{x:10,y:14,w:1},{x:58,y:30,w:0},{x:88,y:8,w:0}];
function cloud(x,y){x=Math.round(x);y=Math.round(y);R(x+4,y,8,2,'#fff');R(x+1,y+2,14,2,'#fff');R(x+1,y+4,14,1,'#B4BCC6');R(x+5,y-1,4,1,'#fff');}
var st='ready',score=0,best=0,vy=0,by=FY-BS,dist=0,pins=[],speed=52,et=0,ml=0,fl=0,gapN=20,t0=0;
try{best=+localStorage.getItem('bounceBest')||0;}catch(e){}
function spd(){return Math.min(200,Math.min(110,52+et)*Math.pow(1.15,Math.floor(score/500)));}
function reset(){score=0;vy=0;by=FY-BS;dist=0;pins=[];speed=52;et=0;ml=0;fl=0;st='run';spawn(W+10);}
function spawn(x){gapN=Math.random()*40;var n=Math.random()<.15?2:1;for(var i=0;i<n;i++)pins.push({x:x+i*6});}
function jump(){if(st=='ready'){reset();vy=-108;return;}if(st=='dead'){if(performance.now()-t0>250)reset();return;}if(by>=FY-BS){vy=-108;}}
addEventListener('pointerdown',function(e){e.preventDefault();jump();});
addEventListener('keydown',function(e){if(e.code=='Space'||e.code=='ArrowUp'){e.preventDefault();if(!e.repeat)jump();}});
function die(){st='dead';t0=performance.now();if(score>best){best=Math.floor(score);try{localStorage.setItem('bounceBest',best);}catch(e){}}}
function step(dt){
 et+=dt;speed=spd();score+=dt*12;fl=Math.max(0,fl-dt);var m=Math.floor(score/500);if(m>ml){ml=m;fl=.8;}dist+=speed*dt;
 vy+=340*dt;by+=vy*dt;if(by>=FY-BS){by=FY-BS;vy=0;}
 for(var i=0;i<pins.length;i++)pins[i].x-=speed*dt;
 while(pins.length&&pins[0].x<-8)pins.shift();
 var last=pins.length?pins[pins.length-1].x:-99;
 if(last<W-(speed*.64+16)-gapN)spawn(W+4);
 for(i=0;i<pins.length;i++){var p=pins[i];
  if(BX+BS-4>p.x+1&&BX+3<p.x+PW-1&&by+BS-3>FY-PH+1)die();}
 for(i=0;i<clouds.length;i++){clouds[i].x-=speed*.12*dt;if(clouds[i].x<-18)clouds[i].x=W+4;}
}
function draw(){
 R(0,0,W,H,SKY);
 for(var i=0;i<clouds.length;i++)cloud(clouds[i].x,clouds[i].y);
 var o=-(Math.floor(dist)%8);
 for(var r=0;r<2;r++)for(var c=-1;c<13;c++){var x=c*8+o,y=FY+r*8;
  R(x,y,8,8,BR);R(x,y,8,1,HI);R(x,y+3,8,1,MO);R(x,y+7,8,1,MO);R(x+(r?7:3),y,1,3,MO);R(x+(r?3:7),y+4,1,3,MO);}
 R(0,FY+16,W,0,BR);
 for(i=0;i<pins.length;i++)pin(Math.round(pins[i].x));
 if(st=='ready'){pin(23);g.drawImage(bs,BX+1,66);}
 else g.drawImage(bs,BX,Math.round(by));
 if(st=='dead'){txt('GAME OVER',30,50,BLK);}
 R(0,118,W,10,NAVY);R(0,118,W,1,'#4a4aa0');
 txt(pad(score),3,121,fl>0&&Math.floor(fl*10)%2?'#CCFF00':'#fff');txt('HI',56,121,'#fff');txt(pad(best),67,121,'#fff');
}
var lt=performance.now();
function loop(n){var dt=Math.min(.05,(n-lt)/1000);lt=n;if(st=='run')step(dt);draw();requestAnimationFrame(loop);}
requestAnimationFrame(loop);
</script></body></html>
